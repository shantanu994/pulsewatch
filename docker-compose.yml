
services:
  postgres:
    image: postgres:16
    container_name: pulsewatch-postgres
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch123
      POSTGRES_DB: pulsewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulsewatch-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: